name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CI cannot see the sibling ../rust-dmd checkout; strip the local-path
      # patch so the crates.io release of koopman-dmd is used instead.
      # NOTE: revisit in Phase 3 — while kdmd-snn depends on unreleased dmdc
      # work, CI should either check out the rust-dmd `dmdc` branch alongside
      # or use a git dependency until koopman-dmd 0.2.0 is published.
      - name: Remove local koopman-dmd patch
        run: sed -i '/\[patch.crates-io\]/,$d' Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
